name: Monitor Bob

on:
  schedule:
    - cron: "2-59/5 * * * *"   # ogni 5 minuti (evita il minuto :00, il più congestionato)
  workflow_dispatch:
    inputs:
      test:
        description: "Invia una notifica di prova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-bob
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Controlla disponibilità
        run: python3 monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test }}
          PARTY_SIZES: "2,3,4,5"

      - name: Salva stato (solo se cambiato)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -q -m "stato $(date -u +%FT%TZ)"
            git pull -q --rebase && git push -q
          fi
