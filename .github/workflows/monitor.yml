name: Monitor Bob

on:
  schedule:
    # ogni 5 minuti, 06:00-22:59 UTC = copre 8:00-23:50 a Roma sia con ora solare che legale;
    # la fascia esatta la filtra lo script. Il minuto :00 è evitato perché è il più congestionato.
    - cron: "2-59/5 6-22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Invia una notifica di prova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-bob
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Controlla disponibilità
        run: python3 monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test }}
          PARTY_SIZES: "2,3,4,5"
          SLOT_FROM: "20:30"     # orario del tavolo, estremi inclusi
          SLOT_TO: "22:15"
          ACTIVE_FROM: "08:00"   # fascia oraria in cui controllare
          ACTIVE_TO: "23:50"

      - name: Salva stato (solo se cambiato)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -q -m "stato $(date -u +%FT%TZ)"
            git pull -q --rebase && git push -q
          fi
