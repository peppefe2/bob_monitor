name: Monitor Bob

# Un controllo per run (circa 20 secondi). Lo avvia cron-job.org ogni 5 minuti,
# dalle 8:00 alle 23:55, tramite l'API workflow_dispatch di GitHub.
# STOP: disattiva il cronjob su cron-job.org (oppure Actions -> Monitor Bob -> "..." -> Disable workflow).
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Invia una notifica di prova"
        type: boolean
        default: false

permissions:
  contents: write   # commit di state.json

concurrency:
  group: monitor-bob
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Controlla disponibilità
        run: python3 monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test }}
          PARTY_SIZES: "2,3,4,5"
          SLOT_FROM: "20:30"     # orario del tavolo, estremi inclusi
          SLOT_TO: "22:15"
          ACTIVE_FROM: "08:00"   # fascia oraria in cui controllare
          ACTIVE_TO: "23:50"

      - name: Salva stato (solo se cambiato)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -q -m "stato $(date -u +%FT%TZ)"
            git pull -q --rebase && git push -q
          fi
