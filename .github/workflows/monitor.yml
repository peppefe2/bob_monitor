name: Monitor Bob

# Ogni run controlla per circa 2 ore (fuori fascia resta in attesa senza interrogare l'API),
# salva lo stato e avvia da solo il run successivo: non dipende dallo scheduler di GitHub.
# AVVIO: una volta "Run workflow" a mano.
# STOP: Actions -> Monitor Bob -> "..." -> Disable workflow
#       (annullare il run in corso non basta se ce n'è già uno in coda).
# Il cron orario è solo un ripiego se la catena si interrompe, nel caso GitHub lo esegua.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Invia una notifica di prova all'avvio"
        type: boolean
        default: false

permissions:
  contents: write   # commit di state.json
  actions: write    # avvio del run successivo

concurrency:
  group: monitor-bob
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - name: Controlla disponibilità
        id: check
        run: python3 monitor.py --duration 115 --every 2
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test }}
          PARTY_SIZES: "2,3,4,5"
          SLOT_FROM: "20:30"     # orario del tavolo, estremi inclusi
          SLOT_TO: "22:15"
          ACTIVE_FROM: "08:00"   # fascia oraria in cui controllare
          ACTIVE_TO: "23:50"

      - name: Salva stato (solo se cambiato)
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -q -m "stato $(date -u +%FT%TZ)"
            git pull -q --rebase && git push -q
          fi

      - name: Avvia il run successivo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # se il controllo è andato in errore, aspetta un po' per non girare a vuoto
          if [ "${{ steps.check.outcome }}" != "success" ]; then sleep 180; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" -f ref="${{ github.ref_name }}"
